<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Data flow: Elementor form to Freshsales lead">
  <rect width="860" height="200" fill="#ffffff"/>
  <!-- boxes -->
  <g>
    <rect x="20" y="60" width="180" height="80" rx="10" fill="#f3f4f6" stroke="#c7cdd6"/>
    <text x="110" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Elementor Form</text>
    <text x="110" y="116" text-anchor="middle" font-size="12" fill="#6b7280">visitor submits</text>
  </g>
  <g>
    <rect x="330" y="45" width="200" height="110" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="430" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Elementor Freshsales</text>
    <text x="430" y="102" text-anchor="middle" font-size="12" fill="#4f46e5">map fields &#183; sanitize</text>
    <text x="430" y="120" text-anchor="middle" font-size="12" fill="#4f46e5">domain allowlist</text>
    <text x="430" y="138" text-anchor="middle" font-size="12" fill="#4f46e5">POST /api/leads</text>
  </g>
  <g>
    <rect x="660" y="60" width="180" height="80" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="750" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Freshsales CRM</text>
    <text x="750" y="116" text-anchor="middle" font-size="12" fill="#047857">new lead created</text>
  </g>
  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/></marker>
  </defs>
  <line x1="200" y1="100" x2="325" y2="100" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <line x1="530" y1="100" x2="655" y2="100" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="188" text-anchor="middle" font-size="11" fill="#9ca3af">Token auth &#183; wp_safe_remote_request &#183; best-effort source &amp; notes</text>
</svg>
